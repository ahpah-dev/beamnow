[package]
name = "beamnow"
version = "0.1.0"
edition = "2024"
description = "A minimal, pure-Rust desktop coding agent with customizable themes."
license = "Unlicense"
repository = "https://github.com/ahpah-dev/beamnow"

[dependencies]
anyhow = "1.0.104"
dirs = "7.0.0"
eframe = "0.37.0"
egui = "0.37.0"
egui_commonmark = "0.26.0"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"
